<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo de vivacidade</title>
<style>
  :root { --bg:#fff; --fg:#14171a; --muted:#5f6b76; --line:#d9dee3; --ok:#12805c; --bad:#b42318; --accent:#1f4fd8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --fg:#eceff2; --muted:#9aa5b0; --line:#2b323a; --ok:#3ccf9a; --bad:#ff7b6b; --accent:#7ea2ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 16px; }
  .stage { position:relative; aspect-ratio:4/3; background:#000; border-radius:12px; overflow:hidden; border:1px solid var(--line); }
  video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .oval { position:absolute; inset:10% 25%; border:3px dashed rgba(255,255,255,.7); border-radius:50%; pointer-events:none; }
  #instruction { margin:16px 0 4px; font-size:1.2rem; font-weight:600; min-height:1.6em; }
  #instruction[data-tone=ok] { color:var(--ok); } #instruction[data-tone=bad] { color:var(--bad); }
  #hint { color:var(--muted); min-height:1.5em; margin:0 0 8px; }
  ol#steps { padding-left:20px; margin:8px 0 16px; color:var(--muted); }
  ol#steps li.now { color:var(--fg); font-weight:600; } ol#steps li.ok { color:var(--ok); } ol#steps li.bad { color:var(--bad); }
  button { font:inherit; padding:10px 18px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #warn { background:rgba(180,35,24,.1); border:1px solid var(--bad); color:var(--bad); padding:8px 12px; border-radius:8px; margin-top:12px; }
  #result { border:1px solid var(--line); border-radius:12px; padding:4px 16px 12px; margin-top:16px; }
  #result[data-ok=true] h2 { color:var(--ok); } #result[data-ok=false] h2 { color:var(--bad); }
  .small { color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>Demo de detecção de vivacidade</h1>
  <p class="lead">Desafios ativos aleatórios, processados no seu navegador. Nenhuma imagem é gravada ou enviada.</p>
  <div class="stage"><video id="video" playsinline muted></video><div class="oval"></div></div>
  <div id="instruction" aria-live="polite">Pronto para começar</div>
  <p id="hint" aria-live="polite"></p>
  <ol id="steps"></ol>
  <button id="start" type="button">Iniciar verificação</button>
  <div id="warn" hidden></div>
  <section id="result" hidden aria-live="polite"></section>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
